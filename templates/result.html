<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RESULT | TECH ENGLISH ATTACK</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="result-page">
  <main class="result-shell">
    <p class="eyebrow">MISSION COMPLETE</p>
    <h1>RESULT</h1>
    <div class="final-score"><span>SCORE</span><strong id="final-score">0</strong></div>
    <div class="stats-grid">
      <div><span>CORRECT</span><strong id="correct-count">0</strong></div>
      <div><span>WRONG</span><strong id="wrong-count">0</strong></div>
      <div><span>ACCURACY</span><strong id="accuracy">0%</strong></div>
      <div><span>MAX COMBO</span><strong id="max-combo">0</strong></div>
    </div>
    <section class="wrong-words-panel"><h2>WRONG WORDS</h2><ul id="wrong-words"><li>NO DATA</li></ul></section>
    <a id="retry-link" class="start-button small" href="{{ url_for('game') }}">RETRY <span>▶</span></a>
    <a class="back-link" href="{{ url_for('home') }}">← HOME</a>
  </main>
  <script>
    const result = JSON.parse(sessionStorage.getItem("techEnglishAttackResult") || "null");
    if (result) {
      document.getElementById("final-score").textContent = result.score;
      document.getElementById("correct-count").textContent = result.correct;
      document.getElementById("wrong-count").textContent = result.wrong;
      document.getElementById("accuracy").textContent = result.accuracy + "%";
      document.getElementById("max-combo").textContent = result.maxCombo;
      document.getElementById("retry-link").href = "{{ url_for('game') }}?mode=" + result.mode + "&level=" + result.level;
      const list = document.getElementById("wrong-words"); list.innerHTML = "";
      if (result.wrongWords.length === 0) list.innerHTML = "<li>PERFECT RUN</li>";
      result.wrongWords.forEach((item) => { const li = document.createElement("li"); li.textContent = item.word + " — " + item.answer; list.appendChild(li); });
    }
  </script>
</body>
</html>
